<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Installments</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#1976d2;
color:white;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
padding:20px;
}

.card{
background:white;
border-radius:15px;
padding:20px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
background:#1976d2;
color:white;
border:none;
border-radius:10px;
font-size:18px;
}

#list{
margin-top:20px;
}
</style>

</head>

<body>

<header>
💳 My Installments
</header>

<div class="container">

<div class="card">

<h2>เพิ่มรายการผ่อน</h2>

<input id="name" placeholder="ชื่อสินค้า">

<input id="price" type="number" placeholder="ยอดผ่อนต่อเดือน">

<button onclick="addItem()">
เพิ่มรายการ
</button>

</div>

<div id="list"></div>

</div>

<script>

function addItem(){

let name=document.getElementById("name").value;

let price=document.getElementById("price").value;

if(name==""||price==""){
alert("กรอกข้อมูลให้ครบ");
return;
}

let html=`
<div class="card">
<h3>${name}</h3>
<p>ยอดผ่อนเดือนละ ${price} บาท</p>
</div>
`;

document.getElementById("list").innerHTML+=html;

document.getElementById("name").value="";
document.getElementById("price").value="";

}

</script>

</body>
</html>
