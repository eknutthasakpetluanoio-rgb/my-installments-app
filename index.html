html = """<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Installments</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f2f4f8}
header{background:#1976d2;color:#fff;padding:18px;text-align:center;font-size:24px;font-weight:bold}
.container{max-width:700px;margin:auto;padding:20px}
.card,.item{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:16px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:10px}
button{width:100%;padding:12px;border:none;border-radius:10px;background:#1976d2;color:#fff;font-size:16px;cursor:pointer}
.delete{background:#d32f2f;margin-top:10px}
.total{font-size:20px;font-weight:bold;text-align:right;margin-top:16px}
</style>
</head>
<body>
<header>💳 My Installments</header>
<div class="container">
<div class="card">
<h2>เพิ่มรายการผ่อน</h2>
<input id="name" placeholder="ชื่อสินค้า">
<input id="price" type="number" placeholder="ยอดผ่อนต่อเดือน">
<button onclick="addItem()">เพิ่มรายการ</button>
</div>
<div id="list"></div>
<div class="total">รวมต่อเดือน: <span id="total">0</span> บาท</div>
</div>

<script>
let items = JSON.parse(localStorage.getItem("installments") || "[]");

function save(){
 localStorage.setItem("installments", JSON.stringify(items));
}

function render(){
 let html="";
 let total=0;
 items.forEach((it,i)=>{
   total += Number(it.price);
   html += `
   <div class="item">
     <h3>${it.name}</h3>
     <p>ยอดผ่อนต่อเดือน <b>${Number(it.price).toLocaleString()} บาท</b></p>
     <button class="delete" onclick="removeItem(${i})">ลบรายการ</button>
   </div>`;
 });
 document.getElementById("list").innerHTML = html;
 document.getElementById("total").textContent = total.toLocaleString();
}

function addItem(){
 const name=document.getElementById("name").value.trim();
 const price=document.getElementById("price").value.trim();
 if(!name || !price){
   alert("กรอกข้อมูลให้ครบ");
   return;
 }
 items.push({name,price:Number(price)});
 save();
 render();
 document.getElementById("name").value="";
 document.getElementById("price").value="";
}

function removeItem(i){
 items.splice(i,1);
 save();
 render();
}

render();
</script>
</body>
</html>
"""

out = Path("/mnt/data/index.html")
out.write_text(html, encoding="utf-8")
print(out)
