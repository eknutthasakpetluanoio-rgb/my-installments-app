<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Installments</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#1976d2;
    color:white;
    text-align:center;
    padding:18px;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    margin-bottom:20px;
}

h2{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    background:#1976d2;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.item{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.delete{
    background:#d32f2f;
}

.total{
    text-align:right;
    font-size:24px;
    font-weight:bold;
    color:#d32f2f;
    margin-top:20px;
}
</style>
</head>

<body>

<header>
💳 My Installments
</header>

<div class="container">

<div class="card">

<h2>เพิ่มรายการผ่อน</h2>

<input
id="name"
placeholder="ชื่อสินค้า">

<input
id="price"
type="number"
placeholder="ยอดผ่อนต่อเดือน">

<button onclick="addItem()">
เพิ่มรายการ
</button>

</div>

<div id="list"></div>

<div class="total">
รวมต่อเดือน :
<span id="total">0</span>
บาท
</div>

</div>

<script>
let items = JSON.parse(localStorage.getItem("installments")) || [];

render();

function addItem(){

    let name = document.getElementById("name").value.trim();
    let price = document.getElementById("price").value.trim();

    if(name==="" || price===""){
        alert("กรอกข้อมูลให้ครบ");
        return;
    }

    items.push({
        name:name,
        price:Number(price)
    });

    saveData();

    document.getElementById("name").value="";
    document.getElementById("price").value="";

    render();
}

function removeItem(index){

    if(confirm("ลบรายการนี้?")){
        items.splice(index,1);
        saveData();
        render();
    }

}

function saveData(){
    localStorage.setItem("installments",JSON.stringify(items));
}

function render(){

    let html="";
    let total=0;

    items.forEach(function(item,index){

        total += item.price;

        html += `
        <div class="item">
            <h3>${item.name}</h3>
            <p>ยอดผ่อนต่อเดือน <b>${item.price.toLocaleString()} บาท</b></p>

            <button class="delete"
            onclick="removeItem(${index})">
            ลบรายการ
            </button>

        </div>
        `;

    });

    document.getElementById("list").innerHTML = html;
    document.getElementById("total").innerText = total.toLocaleString();

}
</script>

</body>
</html>
