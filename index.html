<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Installments</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Kanit',sans-serif;
}

body{
background:#f3f5f9;
}

header{
background:#1976d2;
color:#fff;
padding:22px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
margin-bottom:25px;
}

h2{
margin-bottom:20px;
}

input{
width:100%;
padding:16px;
margin-bottom:16px;
border:1px solid #ddd;
border-radius:12px;
font-size:18px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:12px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.add{
background:#1976d2;
color:white;
}

.delete{
background:#d32f2f;
color:white;
margin-top:15px;
}

.item{
background:white;
padding:20px;
border-radius:18px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

.item h3{
font-size:26px;
margin-bottom:10px;
}

.item p{
font-size:19px;
margin:6px 0;
}

#total{
font-size:36px;
font-weight:bold;
text-align:right;
color:#d32f2f;
margin-top:20px;
}

</style>
</head>

<body>

<header>
💳 My Installments
</header>

<div class="container">

<div class="card">

<h2>เพิ่มรายการผ่อน</h2>

<input
id="name"
type="text"
placeholder="ชื่อสินค้า">

<input
id="price"
type="number"
placeholder="ยอดผ่อนต่อเดือน">

<button
class="add"
onclick="addItem()">
เพิ่มรายการ
</button>

</div>

<div id="list"></div>

<div id="total">
รวมต่อเดือน : 0 บาท
</div>

</div>

<script>

let items =
JSON.parse(
localStorage.getItem("items")
) || [];

render();

function save(){

localStorage.setItem(
"items",
JSON.stringify(items)
);

}

function addItem(){

let name =
document.getElementById("name").value;

let price =
Number(document.getElementById("price").value);

if(name=="" || price<=0){

alert("กรอกข้อมูลให้ครบ");

return;

}

items.push({

name:name,

price:price

});

save();

render();

document.getElementById("name").value="";

document.getElementById("price").value="";

}
function deleteItem(index){

items.splice(index,1);

save();

render();

}

function render(){

let html="";

let total=0;

for(let i=0;i<items.length;i++){

total+=items[i].price;

html+=`

<div class="item">

<h3>📱 ${items[i].name}</h3>

<p>💰 ผ่อนเดือนละ :
<b>${items[i].price.toLocaleString()} บาท</b></p>

<button
class="delete"
onclick="deleteItem(${i})">

ลบรายการ

</button>

</div>

`;

}

document.getElementById("list").innerHTML=html;

document.getElementById("total").innerHTML=

"รวมต่อเดือน : "+

total.toLocaleString()

+" บาท";

}
</script>

</body>

</html>
