<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>รายละเอียดการผ่อน</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Kanit',sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#1976d2;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.card{

background:white;

padding:20px;

border-radius:18px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

margin-bottom:20px;

}

.title{

font-size:30px;

font-weight:bold;

margin-bottom:10px;

}

.subtitle{

font-size:20px;

color:#666;

margin-bottom:20px;

}

.info{

font-size:20px;

margin:8px 0;

}

.back{

width:100%;

padding:16px;

background:#1976d2;

color:white;

border:none;

border-radius:12px;

font-size:20px;

margin-top:20px;

cursor:pointer;

}

.schedule{

background:white;

padding:18px;

border-radius:15px;

margin-top:15px;

box-shadow:0 3px 10px rgba(0,0,0,.08);

}

</style>

</head>

<body>

<header>

รายละเอียดการผ่อน

</header>

<div class="container">

<div class="card">

<div class="title">

📱 vivo V70

</div>

<div class="subtitle">

เลขสัญญา SBR0001339

</div>

<div class="info">

💰 ผ่อนเดือนละ 2,230 บาท

</div>

<div class="info">

📦 ทั้งหมด 14 งวด

</div>

<div class="info">

✅ ชำระแล้ว 0 งวด

</div>

<div class="info">

💵 คงเหลือ 31,220 บาท

</div>

</div>

<div id="scheduleList">

</div>

<button

class="back"

onclick="location.href='index.html'">

⬅ กลับหน้าหลัก

</button>

<script>
const schedules = [

{no:1,date:"15/08/2569",amount:2230,paid:false},
{no:2,date:"15/09/2569",amount:2230,paid:false},
{no:3,date:"15/10/2569",amount:2230,paid:false},
{no:4,date:"15/11/2569",amount:2230,paid:false},
{no:5,date:"15/12/2569",amount:2230,paid:false},
{no:6,date:"15/01/2570",amount:2230,paid:false},
{no:7,date:"15/02/2570",amount:2230,paid:false},
{no:8,date:"15/03/2570",amount:2230,paid:false},
{no:9,date:"15/04/2570",amount:2230,paid:false},
{no:10,date:"15/05/2570",amount:2230,paid:false},
{no:11,date:"15/06/2570",amount:2230,paid:false},
{no:12,date:"15/07/2570",amount:2230,paid:false},
{no:13,date:"15/08/2570",amount:2230,paid:false},
{no:14,date:"15/09/2570",amount:2230,paid:false}

];

renderSchedule();

function renderSchedule(){

let html="";

schedules.forEach((item,index)=>{

html+=`

<div class="schedule">

<h3>งวด ${item.no}</h3>

<p>📅 ${item.date}</p>

<p>💰 ${item.amount.toLocaleString()} บาท</p>

<p id="status${index}">
${item.paid ? "🟢 ชำระแล้ว" : "🔴 ยังไม่ชำระ"}
</p>

<button
class="back"
onclick="pay(${index})">

${item.paid ? "ยกเลิกการชำระ" : "ชำระงวดนี้"}

</button>

</div>

`;

});

document.getElementById("scheduleList").innerHTML=html;

}

function pay(index){

schedules[index].paid=!schedules[index].paid;

renderSchedule();

}
function saveData(){

localStorage.setItem(
"vivoSchedule",
JSON.stringify(schedules)
);

}

function loadData(){

let data=localStorage.getItem("vivoSchedule");

if(data){

let old=JSON.parse(data);

for(let i=0;i<schedules.length;i++){

schedules[i].paid=old[i].paid;

}

}

}

const oldPay=pay;

pay=function(index){

oldPay(index);

saveData();

};

loadData();

renderSchedule();

</script>

</body>

</html>
