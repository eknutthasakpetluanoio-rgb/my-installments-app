<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Installments</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Kanit',sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#1976d2;
color:#fff;
padding:22px;
text-align:center;
font-size:32px;
font-weight:bold;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
margin-bottom:25px;
}

h2{
margin-bottom:20px;
}

input{
width:100%;
padding:16px;
margin-bottom:16px;
border:1px solid #ddd;
border-radius:12px;
font-size:18px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:12px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.add{
background:#1976d2;
color:#fff;
}

.detail{
background:#43a047;
color:#fff;
margin-top:12px;
}

.delete{
background:#d32f2f;
color:#fff;
margin-top:12px;
}

.item{
background:#fff;
padding:20px;
border-radius:18px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

.item h3{
font-size:28px;
margin-bottom:10px;
}

.item p{
font-size:20px;
margin:8px 0;
}

#total{
font-size:34px;
font-weight:bold;
color:#d32f2f;
text-align:right;
margin-top:20px;
}
</style>

</head>

<body>

<header>
💳 My Installments
</header>

<div class="container">

<div class="card">

<h2>เพิ่มรายการผ่อน</h2>

<input
id="name"
type="text"
placeholder="ชื่อสินค้า">

<input
id="price"
type="number"
placeholder="ยอดผ่อนต่อเดือน">

<button
class="add"
onclick="addItem()">
เพิ่มรายการ
</button>

</div>

<div id="list"></div>

<h2 id="total">
รวมต่อเดือน : 0 บาท
</h2>

</div>

<script>

let items =
JSON.parse(
localStorage.getItem("items")
) || [];

render();

function save(){

localStorage.setItem(
"items",
JSON.stringify(items)
);

}

function addItem(){

const name =
document.getElementById("name").value.trim();

const price =
Number(document.getElementById("price").value);

if(name=="" || price<=0){

alert("กรอกข้อมูลให้ครบ");

return;

}

items.push({

name:name,

price:price

});

save();

render();

document.getElementById("name").value="";

document.getElementById("price").value="";

}
function deleteItem(index){

if(confirm("ต้องการลบรายการนี้ใช่หรือไม่?")){

items.splice(index,1);

save();

render();

}

}

function detail(index){

alert(
"หน้ารายละเอียดกำลังพัฒนา\n\n"+
"สินค้า : "+items[index].name+
"\nยอดผ่อน : "+
items[index].price.toLocaleString()+
" บาท/เดือน"
);

}

function render(){

let html="";

let total=0;

items.forEach((item,index)=>{

total+=Number(item.price);

html+=`

<div class="item">

<h3>📱 ${item.name}</h3>

<p>
💰 ผ่อนเดือนละ :
<b>${Number(item.price).toLocaleString()} บาท</b>
</p>

<button
class="detail"
onclick="detail(${index})">

ดูรายละเอียด

</button>

<button
class="delete"
onclick="deleteItem(${index})">

ลบรายการ

</button>

</div>

`;

});

document.getElementById("list").innerHTML=html;

document.getElementById("total").innerHTML=

"รวมต่อเดือน : "+

total.toLocaleString()

+" บาท";

}
</script>

</body>
</html>
